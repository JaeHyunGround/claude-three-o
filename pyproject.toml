[project]
name = "claude-three-o"
version = "1.0.0"
description = "Unified SEO + GEO + AAO optimization plugin for Claude Code"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1.0",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_geo_mentions.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
files = [
    "scripts/validate_url.py",
    "scripts/config.py",
    "scripts/fetch_page.py",
    "scripts/db_manager.py",
    "scripts/score_calculator.py",
    "scripts/report_generator.py",
]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
